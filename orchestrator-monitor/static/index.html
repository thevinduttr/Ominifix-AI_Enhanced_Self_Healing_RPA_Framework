<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bots Monitor</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#94a3b8;
      --accent:#60a5fa;
      --success:#10b981;
      --danger:#ef4444;
      --table-border:rgba(255,255,255,0.06);
    }

    body{
      font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
      margin:0;
      padding:28px;
      background:linear-gradient(180deg,#071021 0%,#071724 100%);
      color:#e6eef8;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size:1.35rem;
      font-weight:600;
      color:#fff;
    }

    .sub{
      color:var(--muted);
      font-size:0.9rem;
      margin-top:4px;
    }

    .controls{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .btn{
      background:var(--accent);
      border:none;
      padding:8px 14px;
      color:#071021;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      transition:0.2s;
    }
    .btn:hover{
      opacity:0.85;
      transform:translateY(-1px);
    }

    .muted{
      font-size:0.9rem;
      color:var(--muted);
    }

    /* Card Container */
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px;
      padding:16px;
      box-shadow:0 8px 28px rgba(0,0,0,0.45);
    }

    /* layout: left table, right charts */
    .card{display:flex;gap:18px;align-items:flex-start}
    .card-left{flex:2;min-width:0}
    .card-right{flex:1;display:flex;flex-direction:column;gap:12px}
    .chart-card{background:transparent;padding:10px;border-radius:10px}
    canvas{width:100% !important;height:200px !important}

    @media(max-width:900px){
      .card{flex-direction:column}
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      border-radius:14px;
      overflow:hidden;
    }

    thead th{
      background:rgba(255,255,255,0.04);
      padding:14px 18px;
      font-size:0.85rem;
      font-weight:600;
      color:#cbd5e1;
      border-bottom:1px solid var(--table-border);
      text-align:start;
    }

    tbody td{
      padding:14px 18px;
      border-bottom:1px solid var(--table-border);
      font-size:0.95rem;
      color:#e2e8f0;
    }

    tbody tr:last-child td{
      border-bottom:0;
    }

    .badge{
      padding:6px 10px;
      border-radius:999px;
      font-weight:600;
      font-size:0.75rem;
      display:inline-block;
    }

    .running  { background:rgba(16,185,129,0.12); color:var(--success); border:1px solid rgba(16,185,129,0.18); }
    .failed   { background:rgba(239,68,68,0.12);  color:var(--danger);  border:1px solid rgba(239,68,68,0.18); }

    @media(max-width:700px){
      thead th, tbody td{
        padding:12px 10px;
        font-size:0.85rem;
      }
      h1{font-size:1.1rem}
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>Bots Monitor</h1>
      <div class="sub">Real-time view of bot heartbeats</div>
    </div>

    <div class="controls">
      <div class="muted">Last update: <strong id="last-update">--</strong></div>
      <button class="btn" id="refresh-btn">Refresh</button>
    </div>
  </header>

  <div class="card">
    <div class="card-left">
      <table>
        <thead>
          <tr>
            <th style="width:38%">Bot ID</th>
            <th style="width:20%">Status</th>
            <th style="width:42%">Last Seen</th>
          </tr>
        </thead>
        <tbody id="bots-tbody">
          <tr><td colspan="3" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card-right">
      <div class="chart-card card">
        <div class="muted" style="margin-bottom:8px;font-weight:600">Bots Status</div>
        <canvas id="doughnutChart" aria-label="Bots status chart"></canvas>
      </div>

      <div class="chart-card card">
        <div class="muted" style="margin-bottom:8px;font-weight:600">Active Bots (history)</div>
        <canvas id="lineChart" aria-label="Active bots over time"></canvas>
      </div>
      
      <div class="chart-card card">
        <div class="muted" style="margin-bottom:8px;font-weight:600">Recent Failures</div>
        <div id="recent-failures" class="muted">No failures yet</div>
      </div>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/static/script.js"></script>

  <!-- Failure JSON modal -->
  <div id="failure-modal" style="display:none;position:fixed;inset:0;z-index:1200;align-items:center;justify-content:center">
    <div id="failure-overlay" style="position:absolute;inset:0;background:rgba(2,6,23,0.6)"></div>
    <div style="position:relative;max-width:900px;width:calc(100% - 40px);margin:auto;z-index:1210">
      <div style="background:var(--card);border-radius:10px;padding:16px;color:#e6eef8;box-shadow:0 12px 40px rgba(2,6,23,0.6)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700">Failure Details</div>
          <button id="failure-modal-close" class="btn" style="background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04)">Close</button>
        </div>

        <div id="failure-fields" style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap"></div>

        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
          <button id="failure-render-dom" class="btn" style="background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.04)">Render DOM</button>
          <div class="muted">(renders DOM snapshot in a sandboxed frame; scripts are blocked)</div>
        </div>

        <div id="failure-dom-container" style="margin-top:12px;display:none;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.04)"></div>

        <div style="margin-top:12px"><strong>Raw JSON</strong></div>
        <pre id="failure-json-pre" style="margin-top:8px;background:rgba(0,0,0,0.06);padding:12px;border-radius:6px;max-height:420px;overflow:auto;color:#e6eef8;font-size:13px"></pre>
      </div>
    </div>
  </div>
</body>
</html>
