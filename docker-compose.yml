version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  model_server:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: orchestrator-monitor/Dockerfile
    command: ["uvicorn","model_server:app","--host","0.0.0.0","--port","8002"]
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq

  orchestrator_monitor:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: orchestrator-monitor/Dockerfile
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
    ports:
      - "8000:8000"
    environment:
      MODEL_URL: https://rpa-error-classifier-555972249634.us-central1.run.app/predict
      RABBIT_HOST: rabbitmq
      PTQA_SERVICE_URL: http://ptqa_service:8000/ptqa/evaluate-healing
      PTQA_READ_TIMEOUT_SECONDS: 30
      RESTART_ON_CATEGORIES: TIMEOUT_ERROR,NETWORK_ERROR,UNKNOWN,BOT_ERROR
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow container to reach host services
    restart: unless-stopped

  frontend_monitor:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: frontend_monitor/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator_monitor
    restart: unless-stopped

  ai_healing_engine:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: orchestrator-coordinator/Dockerfile
    command: ["uvicorn","mock_ai:app","--host","0.0.0.0","--port","5001"]
    ports:
      - "5001:5001"
    depends_on:
      - rabbitmq

  orchestrator_coordinator:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: orchestrator-coordinator/Dockerfile
    command: ["python","consumer.py"]
    environment:
      RABBIT_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai_element_locator:
    build:
      context: ./ai_element_locator_engine
      dockerfile: Dockerfile
    environment:
      - HEALING_ENGINE_URL=http://ai_rpa_healing_engine:8000/api/v1/heal
      - HEALING_ENGINE_TIMEOUT_SECONDS=20
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq

  ai_element_locator_dashboard:
    build:
      context: ./ai_element_locator_engine/locator-dashboard
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - VITE_HEALING_API_BASE_URL=http://localhost:8501
      - ORCHESTRATOR_PROXY_TARGET=http://orchestrator_monitor:8000
    ports:
      - "5173:5173"
    depends_on:
      - ai_element_locator
    restart: unless-stopped

  ai_rpa_healing_engine:
    build:
      context: ./ai_rpa_healing_engine
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8501:8000"
    restart: unless-stopped

  ai_rpa_healing_ui:
    build:
      context: ./ai_rpa_healing_engine
      dockerfile: Dockerfile
    environment:
      - HEALING_API_BASE_URL=http://ai_rpa_healing_engine:8000
    command: ["streamlit", "run", "src/ui/app.py", "--server.address=0.0.0.0", "--server.port=8601"]
    ports:
      - "8601:8601"
    depends_on:
      - ai_rpa_healing_engine
    restart: unless-stopped

  ptqa_service:
    build:
      context: ./ptqa_service
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    restart: unless-stopped

  bot_normal:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: dummy_bot/Dockerfile
    command: ["python","bot.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
    depends_on:
      - orchestrator_monitor

  bot_fail:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: dummy_bot/Dockerfile
    command: ["python","bot_fail.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
    depends_on:
      - orchestrator_monitor

  bot_logic_error:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: dummy_bot/Dockerfile
    command: ["python", "bot_logic_error.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
      - BOT_ID=BOT-AUTH-ERROR-001
      - FAILURE_EVERY=4
      - HEARTBEAT_INTERVAL=3
    depends_on:
      - orchestrator_monitor

  bot_element_not_found_real:
    build:
      context: ./distributed_self_healing_orchestrator
      dockerfile: dummy_bot/Dockerfile
    command: ["python", "bot_element_not_found_real.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
      - BOT_ID=BOT-REAL-ELEMENT-NOT-FOUND-001
      - HEARTBEAT_INTERVAL=3
      - FAILURE_EVERY=4
      - TARGET_URL=https://www.wikipedia.org/
      - MISSING_SELECTOR=#non_existing_checkout_button
    depends_on:
      - orchestrator_monitor

  sliit_pdp_rpa_bot:
    build:
      context: ./sliit_pdp_rpa
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - ORCHESTRATOR_URL=http://orchestrator_monitor:8000
      - ORCHESTRATOR_ENABLED=true
    volumes:
      - ./sliit_pdp_rpa/outputs:/app/sliit_pdp_rpa/outputs
      - ./sliit_pdp_rpa/logs:/app/sliit_pdp_rpa/logs
    depends_on:
      - orchestrator_monitor
      - ai_element_locator
    restart: "no"

  sliit_pdp_rpa_element_not_found_bot:
    build:
      context: ./sliit_pdp_rpa
      dockerfile: Dockerfile
    command: ["python", "src/element_not_found_bot.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - MONITOR_URL=http://orchestrator_monitor:8000
      - BOT_ID=BOT-REAL-ELEMENT-NOT-FOUND-001
      - HEARTBEAT_INTERVAL=3
    volumes:
      - ./sliit_pdp_rpa/outputs:/app/sliit_pdp_rpa/outputs
      - ./sliit_pdp_rpa/logs:/app/sliit_pdp_rpa/logs
    depends_on:
      - orchestrator_monitor
      - ai_element_locator
    restart: "no"

volumes:
  rabbitmq_data:
    external: true
    name: ominifix_rabbitmq_data
 