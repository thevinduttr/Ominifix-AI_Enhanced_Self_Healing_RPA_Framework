<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title or "AI-Powered Element Locator Engine" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  />
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="logo-circle">AI</div>
      <div>
        <h1 class="app-title">AI-Powered Element Locator Engine</h1>
        <p class="app-subtitle">
          DOM + Computer Vision + ML-based Locator Analysis
        </p>
      </div>
    </div>
    <div class="header-right">
      <span class="tag">PP1 Prototype</span>
    </div>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <span>Research Project – Element Locator Engine | {{ report_footer or "PP1 Demo" }}</span>
  </footer>

  <!-- Simple full-screen loader -->
  <div id="loader-overlay" class="loader-overlay hidden">
    <div class="loader-card">
      <div class="spinner"></div>
      <p>Running failure simulation and locator engine…</p>
    </div>
  </div>
</body>
</html>
