<!DOCTYPE html>
<html>
<head>
  <title>Banking Login v1</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .primary-btn {
      padding: 10px 24px;
      background-color: #1e40af;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .link-btn {
      color: #1e40af;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Secure Online Banking</h1>

  <label for="user">Username</label><br>
  <input type="text" id="user"><br><br>

  <label for="pass">Password</label><br>
  <input type="password" id="pass"><br><br>

  <!-- target action elements -->
  <button id="submit-btn" class="primary-btn">Login</button>
  <span class="link-btn" id="forgot-link">Forgot Password?</span>

  <p id="status"></p>

  <script>
    document.getElementById("submit-btn").onclick = function () {
      document.getElementById("status").innerText = "Login success (v1)";
    };
  </script>
</body>
</html>
