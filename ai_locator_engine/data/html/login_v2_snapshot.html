<html><head>
  <title>Banking Login v2</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .primary-action {
      padding: 12px 26px;
      background-color: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .link-btn {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Secure Online Banking</h1>

  <label for="user">User ID</label><br>
  <input type="text" id="user"><br><br>

  <label for="pass">Password</label><br>
  <input type="password" id="pass"><br><br>

  <!-- changed: id, class, text, position -->
  <div style="margin-top: 10px;">
    <button id="primary-action" class="primary-action">Sign In</button>
    <span class="link-btn" id="forgot-link">Need help?</span>
  </div>

  <p id="status"></p>

  <script>
    document.getElementById("primary-action").onclick = function () {
      document.getElementById("status").innerText = "Login success (v2)";
    };
  </script>


</body></html>
