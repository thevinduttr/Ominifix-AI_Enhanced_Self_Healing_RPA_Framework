version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ominifix_rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  model_server:
    build:
      context: .
      dockerfile: orchestrator-monitor/Dockerfile
    container_name: ominifix_model_server
    command: ["uvicorn","model_server:app","--host","0.0.0.0","--port","8002"]
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq

  orchestrator_monitor:
    build:
      context: .
      dockerfile: orchestrator-monitor/Dockerfile
    container_name: ominifix_monitor
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8000"]
    ports:
      - "8000:8000"
    environment:
      #MODEL_URL: https://rpa-error-classifier-555972249634.us-central1.run.app/predict
      MODEL_URL: http://model_server:8002/classify --- IGNORE ---  # Local model server (for testing)
      RABBIT_HOST: rabbitmq
      BOT_SERVICE_MAP: RPA-0020:bot_form_filler_rpa
    depends_on:
      - rabbitmq
      - model_server

  frontend_monitor:
    build:
      context: .
      dockerfile: frontend_monitor/Dockerfile
    container_name: ominifix_frontend
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator_monitor
    networks:
      - default

  ai_healing_engine:
    build:
      context: .
      dockerfile: orchestrator-coordinator/Dockerfile
    container_name: ominifix_ai_healer
    command: ["uvicorn","mock_ai:app","--host","0.0.0.0","--port","5001"]
    ports:
      - "5001:5001"
    depends_on:
      - rabbitmq

  orchestrator_coordinator:
    build:
      context: .
      dockerfile: orchestrator-coordinator/Dockerfile
    container_name: ominifix_coordinator
    command: ["python","orchestrator-coordinator/consumer.py"]
    environment:
      RABBIT_HOST: rabbitmq
    depends_on:
      - rabbitmq

  ai_element_locator:
    build:
      context: ../ai_element_locator_engine
      dockerfile: Dockerfile
    container_name: ominifix_locator
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq

  ai_element_locator_dashboard:
    build:
      context: ../ai_element_locator_engine/locator-dashboard
      dockerfile: Dockerfile
    container_name: ominifix_locator_dashboard
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
      - ORCHESTRATOR_PROXY_TARGET=http://orchestrator_monitor:8000
    ports:
      - "5173:5173"
    depends_on:
      - ai_element_locator

  bot_normal:
    build:
      context: .
      dockerfile: dummy_bot/Dockerfile
    container_name: ominifix_bot_normal
    command: ["python","bot.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
    depends_on:
      - orchestrator_monitor

  bot_fail:
    build:
      context: .
      dockerfile: dummy_bot/Dockerfile
    container_name: ominifix_bot_fail
    command: ["python","bot_fail.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
    depends_on:
      - orchestrator_monitor

  bot_logic_error:
    build:
      context: .
      dockerfile: dummy_bot/Dockerfile
    container_name: ominifix_bot_logic_error
    command: ["python", "bot_logic_error.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
      - BOT_ID=BOT-AUTH-ERROR-001
      - FAILURE_EVERY=4
      - HEARTBEAT_INTERVAL=3
    depends_on:
      - orchestrator_monitor

  bot_element_not_found_real:
    build:
      context: .
      dockerfile: dummy_bot/Dockerfile
    container_name: ominifix_bot_element_not_found_real
    command: ["python", "bot_element_not_found_real.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
      - BOT_ID=BOT-REAL-ELEMENT-NOT-FOUND-001
      - HEARTBEAT_INTERVAL=3
      - FAILURE_EVERY=4
      - TARGET_URL=https://www.wikipedia.org/
      - MISSING_SELECTOR=#non_existing_checkout_button
    depends_on:
      - orchestrator_monitor

  bot_form_filler_rpa:
    build:
      context: .
      dockerfile: dummy_bot/Dockerfile
    container_name: ominifix_bot_form_filler_rpa
    command: ["python", "rpa/run_healed_or_original.py"]
    environment:
      - MONITOR_URL=http://orchestrator_monitor:8000/heartbeat
      - BOT_ID=RPA-0020
      - BOT_SERVICE_NAME=bot_form_filler_rpa
      - HEARTBEAT_INTERVAL=3
      - USE_HEALED_SCRIPT=true
      - HEALED_SCRIPTS_DIR=/app/healed_scripts
      - ORIGINAL_BOT_SCRIPT=/app/rpa/form_filler_bot.py
    volumes:
      - ../ai_rpa_healing_engine/data/outbox/healed_scripts:/app/healed_scripts:ro
    depends_on:
      - orchestrator_monitor

volumes:
  rabbitmq_data:
    name: ominifix_rabbitmq_data
 